<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — BSB Dashboard</title>
<meta name="theme-color" content="#0f172a">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    text-align: center;
    max-width: 420px;
    animation: fadeIn 0.5s ease-out;
  }
  .icon {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    background: linear-gradient(135deg, #1e293b, #334155);
    border: 1px solid #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 36px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 12px;
  }
  p {
    color: #94a3b8;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    background: #dc2626;
    color: white;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn:hover { background: #b91c1c; transform: translateY(-1px); }
  .btn:active { transform: scale(0.98); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">📡</div>
  <h1>Tidak Ada Koneksi</h1>
  <p>BSB Dashboard membutuhkan koneksi internet untuk memuat data terbaru. Periksa koneksi Anda dan coba lagi.</p>
  <button class="btn" onclick="location.reload()">🔄 Coba Lagi</button>
</div>
</body>
</html>
